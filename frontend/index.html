<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlipTheTable - Etsy Clone</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="auth-box">
            <h1>FlipTheTable</h1>

            <!-- Login Form -->
            <div id="loginForm" class="form-container active">
                <h2>Zaloguj się</h2>
                <form onsubmit="handleLogin(event)">
                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Email"
                        required
                    />
                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Hasło"
                        required
                    />
                    <button type="submit">Zaloguj</button>
                    <p class="error" id="loginError"></p>
                </form>
                <p class="toggle-text">
                    Nie masz konta?
                    <a href="#" onclick="toggleForms(event)">Zarejestruj się</a>
                </p>
            </div>

            <!-- Register Form -->
            <div id="registerForm" class="form-container">
                <h2>Rejestracja</h2>
                <form onsubmit="handleRegister(event)">
                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Email"
                        required
                    />
                    <input
                        type="text"
                        id="registerUsername"
                        placeholder="Nazwa użytkownika"
                        required
                    />
                    <input
                        type="text"
                        id="registerFullName"
                        placeholder="Imię i nazwisko"
                    />
                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Hasło (min. 8 znaków)"
                        minlength="8"
                        required
                    />
                    <input
                        type="password"
                        id="registerPassword2"
                        placeholder="Powtórz hasło"
                        required
                    />
                    <button type="submit">Zarejestruj</button>
                    <p class="error" id="registerError"></p>
                </form>
                <p class="toggle-text">
                    Masz już konto?
                    <a href="#" onclick="toggleForms(event)">Zaloguj się</a>
                </p>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
