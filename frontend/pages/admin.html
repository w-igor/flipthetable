<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel administratora — FlipTheTable</title>
  <link rel="stylesheet" href="../css/shop.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body>
  <header class="shop-header">
    <a href="../index.html" class="shop-logo">Flip<span>TheTable</span></a>
    <div class="shop-header-actions" style="margin-left:auto;">
      <select id="langSwitcher" class="lang-switcher"></select>
      <span id="authActions"></span>
    </div>
  </header>

  <div class="dashboard-layout">
    <h1 class="dashboard-title" data-i18n="admin.title">Panel administratora</h1>
    <div id="adminBanner" class="dashboard-banner"></div>

    <div id="adminDenied" class="dashboard-card" style="display:none;">
      <h2 data-i18n="admin.access_denied_heading">Brak dostępu</h2>
      <p class="dashboard-hint" data-i18n="admin.access_denied_hint">To konto nie ma uprawnień administratora.</p>
    </div>

    <div id="adminMain" class="dashboard-shell" style="display:none;">
      <aside class="dashboard-sidebar">
        <nav class="dashboard-sidebar-nav">
          <button class="dashboard-tab active" data-tab="overview" data-i18n="admin.tab_overview">Przegląd</button>
          <button class="dashboard-tab" data-tab="users" data-i18n="admin.tab_users">Użytkownicy</button>
          <button class="dashboard-tab" data-tab="shops" data-i18n="admin.tab_shops">Sklepy</button>
          <button class="dashboard-tab" data-tab="listings" data-i18n="admin.tab_listings">Oferty</button>
          <button class="dashboard-tab" data-tab="orders" data-i18n="admin.tab_orders">Zamówienia</button>
          <button class="dashboard-tab" data-tab="categories" data-i18n="admin.tab_categories">Kategorie</button>
          <button class="dashboard-tab" data-tab="audit" data-i18n="admin.tab_audit">Dziennik zdarzeń</button>
        </nav>
      </aside>

      <div class="dashboard-main">
      <section id="tab-overview" class="dashboard-tab-panel">
        <div class="dashboard-card">
          <h2 data-i18n="admin.platform_stats_heading">Statystyki platformy</h2>
          <div class="dashboard-stats-grid" id="overviewStats"></div>
        </div>
        <div class="dashboard-card">
          <h2 data-i18n="admin.orders_by_status_heading">Zamówienia wg statusu</h2>
          <div class="dashboard-stats-grid" id="overviewOrderStatus"></div>
        </div>
      </section>

      <section id="tab-users" class="dashboard-tab-panel" style="display:none;">
        <div class="dashboard-card">
          <div class="admin-toolbar">
            <input type="text" id="usersSearch" class="admin-search" placeholder="Szukaj po nazwie lub e-mailu..." data-i18n-placeholder="admin.search_users_placeholder" />
          </div>
          <div id="usersTable" class="dashboard-list"></div>
          <div class="admin-pager" id="usersPager"></div>
        </div>
      </section>

      <section id="tab-shops" class="dashboard-tab-panel" style="display:none;">
        <div class="dashboard-card">
          <div class="admin-toolbar">
            <input type="text" id="shopsSearch" class="admin-search" placeholder="Szukaj sklepu..." data-i18n-placeholder="admin.search_shops_placeholder" />
          </div>
          <div id="shopsTable" class="dashboard-list"></div>
          <div class="admin-pager" id="shopsPager"></div>
        </div>
      </section>

      <section id="tab-listings" class="dashboard-tab-panel" style="display:none;">
        <div class="dashboard-card">
          <div class="admin-toolbar">
            <input type="text" id="listingsSearch" class="admin-search" placeholder="Szukaj oferty..." data-i18n-placeholder="admin.search_listings_placeholder" />
            <select id="listingsActiveFilter" class="admin-filter">
              <option value="" data-i18n="admin.filter_all">Wszystkie</option>
              <option value="true" data-i18n="admin.filter_active">Aktywne</option>
              <option value="false" data-i18n="admin.filter_inactive">Nieaktywne</option>
            </select>
          </div>
          <div id="listingsTable" class="dashboard-list"></div>
          <div class="admin-pager" id="listingsPager"></div>
        </div>
      </section>

      <section id="tab-orders" class="dashboard-tab-panel" style="display:none;">
        <div class="dashboard-card">
          <div class="admin-toolbar">
            <select id="ordersStatusFilter" class="admin-filter">
              <option value="" data-i18n="admin.filter_all_statuses">Wszystkie statusy</option>
              <option value="pending" data-i18n="order_status.pending">Oczekujące</option>
              <option value="paid" data-i18n="order_status.paid">Opłacone</option>
              <option value="processing" data-i18n="order_status.processing">W realizacji</option>
              <option value="shipped" data-i18n="order_status.shipped">Wysłane</option>
              <option value="delivered" data-i18n="order_status.delivered">Dostarczone</option>
              <option value="cancelled" data-i18n="order_status.cancelled">Anulowane</option>
              <option value="refunded" data-i18n="order_status.refunded">Zwrócone</option>
            </select>
          </div>
          <div id="ordersTable" class="dashboard-list"></div>
          <div class="admin-pager" id="ordersPager"></div>
        </div>
      </section>

      <section id="tab-categories" class="dashboard-tab-panel" style="display:none;">
        <div class="dashboard-card">
          <div class="dashboard-card-header">
            <h2 data-i18n="admin.categories_heading">Kategorie</h2>
            <button id="newCategoryBtn" class="dashboard-submit-btn dashboard-btn-small" type="button" data-i18n="admin.add_category_btn">+ Dodaj kategorię</button>
          </div>

          <form id="categoryForm" class="dashboard-form" style="display:none;">
            <input type="hidden" id="categoryId" />
            <div class="dashboard-field">
              <label for="categoryName" data-i18n="admin.category_name_label">Nazwa</label>
              <input type="text" id="categoryName" required />
            </div>
            <div class="dashboard-field">
              <label for="categoryParent" data-i18n="admin.category_parent_label">Kategoria nadrzędna</label>
              <select id="categoryParent"></select>
            </div>
            <div class="dashboard-field">
              <label for="categoryDescription" data-i18n="admin.category_desc_label">Opis</label>
              <textarea id="categoryDescription" rows="2"></textarea>
            </div>
            <div class="dashboard-field">
              <label for="categorySortOrder" data-i18n="admin.category_sort_order_label">Kolejność sortowania</label>
              <input type="number" id="categorySortOrder" step="1" value="0" />
            </div>
            <div class="dashboard-form-actions">
              <button type="submit" class="dashboard-submit-btn" id="categorySubmitBtn" data-i18n="admin.add_category_submit">Dodaj kategorię</button>
              <button type="button" class="dashboard-cancel-btn" id="cancelCategoryBtn" data-i18n="common.cancel">Anuluj</button>
            </div>
          </form>

          <div id="categoriesTable" class="dashboard-list"></div>
        </div>
      </section>

      <section id="tab-audit" class="dashboard-tab-panel" style="display:none;">
        <div class="dashboard-card">
          <h2 data-i18n="admin.audit_log_heading">Dziennik zdarzeń</h2>
          <p class="dashboard-hint" data-i18n="admin.audit_log_hint">Historia działań administratorów w panelu.</p>
          <div id="auditTable" class="dashboard-list"></div>
          <div class="admin-pager" id="auditPager"></div>
        </div>
      </section>
      </div>
    </div>
  </div>

  <script src="../js/i18n.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ws.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
