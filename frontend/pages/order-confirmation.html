<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Potwierdzenie zamówienia - FlipTheTable</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container" style="text-align: center; padding: 50px 20px;">
        <div style="background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); max-width: 500px; margin: 0 auto;">
            <h1>✓ Dziękujemy za zakupy!</h1>
            <p style="font-size: 18px; color: #667eea; margin: 15px 0;">Numer zamówienia: <strong id="orderNumber"></strong></p>
            <p style="color: #666; line-height: 1.6;">
                Twoje zamówienie zostało przyjęte. Otrzymasz wiadomość e-mail z potwierdzeniem i szczegółami dotyczącymi wysyłki.
            </p>
            <div style="margin-top: 30px;">
                <a href="orders.html" class="btn-primary" style="display: inline-block; padding: 12px 30px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; text-decoration: none; border-radius: 6px; margin-right: 10px;">Moje zamówienia</a>
                <a href="shop.html" class="btn-secondary" style="display: inline-block; padding: 12px 30px; background: #f0f0f0; color: #333; text-decoration: none; border-radius: 6px;">Kontynuuj zakupy</a>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const orderId = params.get('id');
        if (orderId) {
            document.getElementById('orderNumber').textContent = orderId.substring(0, 8).toUpperCase() + '...';
        } else {
            window.location.href = 'shop.html';
        }
    </script>
</body>
</html>
