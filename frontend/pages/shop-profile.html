<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sklep — FlipTheTable</title>
  <link rel="stylesheet" href="../css/shop.css" />
  <link rel="stylesheet" href="../css/cart.css" />
  <link rel="stylesheet" href="../css/shop-profile.css" />
</head>
<body>
  <header class="shop-header">
    <a href="../index.html" class="shop-logo">Flip<span>TheTable</span></a>
    <div class="shop-header-actions" style="margin-left:auto;">
      <span id="authActions">
        <a href="login.html">Zaloguj się</a>
        <a href="register.html">Zarejestruj się</a>
      </span>
      <button id="cartToggleBtn" class="cart-icon-btn">🛒<span id="cartCount" class="cart-count-badge">0</span></button>
    </div>
  </header>

  <div id="cartOverlay" class="cart-overlay"></div>
  <div id="cartDrawer" class="cart-drawer">
    <div class="cart-drawer-header">
      <h3>Koszyk</h3>
      <button id="closeCartBtn">✕</button>
    </div>
    <div id="cartItemsList" class="cart-items-list"></div>
    <div class="cart-drawer-footer">
      <div class="cart-total-row">
        <span>Razem:</span>
        <span id="cartTotalAmount">0.00 PLN</span>
      </div>
      <a href="checkout.html" class="cart-checkout-btn">Przejdź do kasy</a>
    </div>
  </div>

  <div id="shopProfileHeader" class="shop-profile-header"></div>

  <div class="shop-profile-layout">
    <div id="resultCount" class="shop-result-count"></div>
    <div id="listingGrid" class="listing-grid"></div>
    <div id="emptyState" class="shop-empty-state" style="display:none;">
      Ten sklep nie ma jeszcze żadnych ofert.
    </div>
  </div>

  <script src="../js/nav.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/shop-profile.js"></script>
</body>
</html>
