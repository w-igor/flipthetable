<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kasa — FlipTheTable</title>
  <link rel="stylesheet" href="../css/checkout.css" />
</head>
<body>
  <header class="checkout-header">
    <a href="../index.html">Flip<span>TheTable</span></a>
    <select id="langSwitcher" class="lang-switcher"></select>
  </header>

  <div id="checkoutEmpty" class="checkout-empty" style="display:none;">
    <span data-i18n="checkout.empty_cart">Twój koszyk jest pusty.</span> <a href="shop.html" data-i18n="common.back_to_catalog">Wróć do katalogu</a>.
  </div>

  <div class="checkout-layout" id="checkoutLayout">
    <section class="checkout-form-section">
      <h2 data-i18n="checkout.shipping_heading">Dane wysyłki</h2>
      <div class="checkout-banner error" id="errorBanner"></div>

      <form id="checkoutForm" novalidate>
        <div class="checkout-field">
          <label for="fullName" data-i18n="checkout.full_name">Imię i nazwisko</label>
          <input type="text" id="fullName" required />
        </div>
        <div class="checkout-field">
          <label for="address" data-i18n="checkout.address">Adres</label>
          <input type="text" id="address" required />
        </div>
        <div class="checkout-field-row">
          <div class="checkout-field">
            <label for="city" data-i18n="checkout.city">Miasto</label>
            <input type="text" id="city" required />
          </div>
          <div class="checkout-field">
            <label for="postalCode" data-i18n="checkout.postal_code">Kod pocztowy</label>
            <input type="text" id="postalCode" required />
          </div>
        </div>
        <div class="checkout-field-row">
          <div class="checkout-field">
            <label for="country" data-i18n="checkout.country">Kraj</label>
            <input type="text" id="country" value="Polska" required />
          </div>
          <div class="checkout-field">
            <label for="phone" data-i18n="checkout.phone">Telefon</label>
            <input type="tel" id="phone" required />
          </div>
        </div>
        <div class="checkout-field">
          <label for="note" data-i18n="checkout.note">Notatka do zamówienia (opcjonalnie)</label>
          <textarea id="note" rows="3"></textarea>
        </div>

        <h2 data-i18n="checkout.payment_heading">Płatność (symulowana)</h2>
        <div class="checkout-field">
          <label for="cardholderName" data-i18n="checkout.cardholder_name">Imię i nazwisko na karcie</label>
          <input type="text" id="cardholderName" required />
        </div>
        <div class="checkout-field">
          <label for="cardNumber" data-i18n="checkout.card_number">Numer karty</label>
          <input type="text" id="cardNumber" inputmode="numeric" placeholder="4242 4242 4242 4242" required />
        </div>
        <div class="checkout-field-row">
          <div class="checkout-field">
            <label for="cardExpiry" data-i18n="checkout.card_expiry">Ważna do (MM/RR)</label>
            <input type="text" id="cardExpiry" placeholder="12/28" required />
          </div>
          <div class="checkout-field">
            <label for="cardCvc" data-i18n="checkout.cvc">CVC</label>
            <input type="text" id="cardCvc" inputmode="numeric" placeholder="123" required />
          </div>
        </div>

        <button type="submit" class="checkout-submit-btn" id="submitBtn" data-i18n="checkout.submit">Zapłać i złóż zamówienie</button>
      </form>
    </section>

    <section class="checkout-summary-section">
      <h2 data-i18n="checkout.summary_heading">Podsumowanie</h2>
      <div id="summaryContent"></div>
      <div class="summary-total-row">
        <span data-i18n="checkout.total">Razem</span>
        <span id="summaryTotal">0.00 PLN</span>
      </div>
    </section>
  </div>

  <script src="../js/i18n.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/checkout.js"></script>
</body>
</html>
