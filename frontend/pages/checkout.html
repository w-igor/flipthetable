<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - FlipTheTable</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/checkout.css">
</head>
<body>
    <header class="navbar">
        <div class="container">
            <h1 class="logo">FlipTheTable</h1>
            <nav class="nav-links">
                <a href="shop.html">← Wróć do sklepu</a>
            </nav>
        </div>
    </header>

    <main class="checkout-container">
        <div class="checkout-content">
            <!-- Order Summary -->
            <section class="order-summary">
                <h2>Podsumowanie zamówienia</h2>
                <div id="orderItems" class="order-items">
                    <!-- Items loaded here -->
                </div>
                <div class="summary-totals">
                    <div class="summary-row">
                        <span>Razem:</span>
                        <span id="totalPrice">0,00 zł</span>
                    </div>
                </div>
            </section>

            <!-- Checkout Form -->
            <section class="checkout-form">
                <h2>Adres dostawy</h2>
                <form id="checkoutForm" onsubmit="handleCheckout(event)">
                    <div class="form-group">
                        <label>Imię i nazwisko</label>
                        <input type="text" id="fullName" required />
                    </div>

                    <div class="form-group">
                        <label>Adres</label>
                        <input type="text" id="address" required />
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Miasto</label>
                            <input type="text" id="city" required />
                        </div>
                        <div class="form-group">
                            <label>Kod pocztowy</label>
                            <input type="text" id="postalCode" required pattern="[0-9]{2}-[0-9]{3}" placeholder="XX-XXX" />
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Kraj</label>
                        <select id="country">
                            <option>Polska</option>
                            <option>Niemcy</option>
                            <option>Francja</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Telefon</label>
                        <input type="tel" id="phone" required />
                    </div>

                    <div class="form-group checkbox">
                        <input type="checkbox" id="terms" required />
                        <label for="terms">Akceptuję regulamin i politykę prywatności</label>
                    </div>

                    <button type="submit" class="btn-place-order">Złóż zamówienie</button>
                </form>
            </section>
        </div>
    </main>

    <script src="../js/checkout.js"></script>
</body>
</html>
