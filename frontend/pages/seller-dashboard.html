<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Sprzedawcy - FlipTheTable</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/seller-dashboard.css">
</head>
<body>
    <header class="navbar">
        <div class="container">
            <h1 class="logo">FlipTheTable</h1>
            <nav class="nav-links">
                <span id="shopName" class="seller-badge">Sklep</span>
                <a href="shop.html">← Wróć do sklepu</a>
                <a href="#" onclick="logout()">Wyloguj</a>
            </nav>
        </div>
    </header>

    <main class="seller-container">
        <!-- Sidebar Navigation -->
        <aside class="seller-sidebar">
            <nav class="seller-nav">
                <button class="nav-item active" onclick="switchTab('dashboard')">📊 Dashboard</button>
                <button class="nav-item" onclick="switchTab('listings')">📦 Moje produkty</button>
                <button class="nav-item" onclick="switchTab('orders')">🛒 Zamówienia</button>
            </nav>
        </aside>

        <!-- Main Content -->
        <section class="seller-content">
            <!-- Dashboard Tab -->
            <div id="dashboardTab" class="tab-content active">
                <h2>Panel sprzedawcy</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">Produkty</div>
                        <div class="stat-value" id="statListings">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Zamówienia</div>
                        <div class="stat-value" id="statOrders">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Sprzedaż</div>
                        <div class="stat-value" id="statSales">0 zł</div>
                    </div>
                </div>
            </div>

            <!-- Listings Tab -->
            <div id="listingsTab" class="tab-content">
                <div class="section-header">
                    <h2>Moje produkty</h2>
                    <button class="btn-primary" onclick="openAddListingModal()">+ Dodaj produkt</button>
                </div>

                <div id="listingsList" class="listings-list">
                    <!-- Listings loaded here -->
                </div>
            </div>

            <!-- Orders Tab -->
            <div id="ordersTab" class="tab-content">
                <h2>Zamówienia</h2>
                <div id="sellerOrdersList" class="orders-list">
                    <!-- Orders loaded here -->
                </div>
            </div>
        </section>
    </main>

    <!-- Add/Edit Listing Modal -->
    <div id="listingModal" class="modal">
        <div class="modal-content modal-large">
            <span class="close" onclick="closeListingModal()">&times;</span>
            <h2 id="listingModalTitle">Dodaj produkt</h2>
            <form id="listingForm" onsubmit="handleListingSubmit(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label>Nazwa produktu</label>
                        <input type="text" id="listingTitle" required />
                    </div>
                    <div class="form-group">
                        <label>Kategoria</label>
                        <select id="listingCategory" required>
                            <option value="">Wybierz kategorię</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Opis</label>
                    <textarea id="listingDescription" rows="3" required></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Cena (zł)</label>
                        <input type="number" id="listingPrice" step="0.01" min="0.01" required />
                    </div>
                    <div class="form-group">
                        <label>Ilość w magazynie</label>
                        <input type="number" id="listingQuantity" min="0" required />
                    </div>
                </div>

                <div class="form-group">
                    <label>URL głównego zdjęcia</label>
                    <input type="url" id="listingPhotoUrl" />
                </div>

                <button type="submit" class="btn-primary">Zapisz produkt</button>
            </form>
        </div>
    </div>

    <script src="../js/seller-dashboard.js"></script>
</body>
</html>
