<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Produkt — FlipTheTable</title>
  <link rel="stylesheet" href="../css/shop.css" />
  <link rel="stylesheet" href="../css/cart.css" />
  <style>
    .listing-detail {
      max-width: 1000px;
      margin: 32px auto;
      padding: 0 24px;
      display: flex;
      gap: 40px;
    }
    .listing-detail img {
      width: 420px;
      height: 420px;
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
    }
    .listing-detail-info h1 {
      font-size: 24px;
      margin: 0 0 8px;
    }
    .listing-detail-shop {
      color: #6b6b6b;
      font-size: 14px;
      margin-bottom: 16px;
    }
    .listing-detail-price {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .listing-detail-desc {
      line-height: 1.6;
      margin-bottom: 16px;
    }
    .listing-detail-add-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
    }
    .listing-detail-qty {
      width: 64px;
      padding: 8px;
      border: 1px solid #d5d0c9;
      border-radius: 6px;
    }
    .listing-detail-add-btn {
      padding: 12px 24px;
      background: #f1641e;
      color: #fff;
      border: none;
      border-radius: 24px;
      font-weight: 700;
      cursor: pointer;
    }
    .back-link {
      display: inline-block;
      margin: 16px 24px 0;
      color: #222;
      text-decoration: none;
      font-size: 14px;
    }
    @media (max-width: 720px) {
      .listing-detail { flex-direction: column; }
      .listing-detail img { width: 100%; height: auto; }
    }
    .listing-reviews {
      max-width: 1000px;
      margin: 0 auto 48px;
      padding: 0 24px;
    }
    .listing-reviews h2 {
      font-size: 20px;
      margin-bottom: 16px;
    }
    .review-form-wrap {
      background: #fff;
      border: 1px solid #d5d0c9;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .review-form-wrap select,
    .review-form-wrap textarea {
      display: block;
      width: 100%;
      margin: 6px 0 14px;
      padding: 10px;
      border: 1px solid #d5d0c9;
      border-radius: 6px;
      font-family: inherit;
    }
    .review-form-wrap button {
      padding: 10px 20px;
      background: #f1641e;
      color: #fff;
      border: none;
      border-radius: 20px;
      font-weight: 700;
      cursor: pointer;
    }
    .review-form-error {
      color: #c0392b;
      font-size: 13px;
      margin-top: 8px;
    }
    .review-row {
      border-bottom: 1px solid #eee6da;
      padding: 14px 0;
    }
    .review-header {
      margin: 0 0 4px;
      font-size: 14px;
    }
    .review-stars {
      color: #f1641e;
      margin-left: 6px;
    }
    .review-comment {
      margin: 0 0 4px;
      line-height: 1.5;
    }
    .review-date {
      margin: 0;
      font-size: 12px;
      color: #6b6b6b;
    }
    .reviews-empty {
      color: #6b6b6b;
    }
  </style>
</head>
<body>
  <header class="shop-header">
    <a href="../index.html" class="shop-logo">Flip<span>TheTable</span></a>
    <div class="shop-header-actions" style="margin-left:auto;">
      <span id="authActions">
        <a href="login.html">Zaloguj się</a>
        <a href="register.html">Zarejestruj się</a>
      </span>
      <button id="cartToggleBtn" class="cart-icon-btn">🛒<span id="cartCount" class="cart-count-badge">0</span></button>
    </div>
  </header>

  <div id="cartOverlay" class="cart-overlay"></div>
  <div id="cartDrawer" class="cart-drawer">
    <div class="cart-drawer-header">
      <h3>Koszyk</h3>
      <button id="closeCartBtn">✕</button>
    </div>
    <div id="cartItemsList" class="cart-items-list"></div>
    <div class="cart-drawer-footer">
      <div class="cart-total-row">
        <span>Razem:</span>
        <span id="cartTotalAmount">0.00 PLN</span>
      </div>
      <a href="checkout.html" class="cart-checkout-btn">Przejdź do kasy</a>
    </div>
  </div>

  <a href="shop.html" class="back-link">‹ Wróć do katalogu</a>

  <div id="listingContainer" class="listing-detail"></div>

  <div class="listing-reviews">
    <h2>Opinie</h2>
    <div id="reviewFormWrap" class="review-form-wrap" style="display:none;">
      <form id="reviewForm">
        <label for="reviewRating">Ocena</label>
        <select id="reviewRating">
          <option value="5">5 - świetnie</option>
          <option value="4">4 - dobrze</option>
          <option value="3">3 - średnio</option>
          <option value="2">2 - słabo</option>
          <option value="1">1 - źle</option>
        </select>
        <label for="reviewComment">Komentarz (opcjonalnie)</label>
        <textarea id="reviewComment" rows="3"></textarea>
        <button type="submit" id="reviewSubmitBtn">Dodaj opinię</button>
        <p class="review-form-error" id="reviewFormError"></p>
      </form>
    </div>
    <div id="reviewsList" class="reviews-list"></div>
  </div>

  <script src="../js/nav.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/cart.js"></script>
  <script>
    async function loadListing() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const container = document.getElementById('listingContainer');

      if (!id) {
        container.innerHTML = '<p>Brak ID produktu.</p>';
        return;
      }

      try {
        const res = await fetch(`${API_URL}/listings/${id}`);
        if (!res.ok) {
          container.innerHTML = '<p>Produkt nie znaleziony.</p>';
          return;
        }
        const item = await res.json();
        const img = (item.photos && item.photos[0] && item.photos[0].url) || 'https://picsum.photos/seed/placeholder/600/600';

        document.title = `${item.title} — FlipTheTable`;
        container.innerHTML = `
          <img src="${img}" alt="${escapeHtml(item.title)}" />
          <div class="listing-detail-info">
            <h1>${escapeHtml(item.title)}</h1>
            <p class="listing-detail-shop">Sprzedawca: <a href="shop-profile.html?id=${item.shop_id}">${escapeHtml(item.shop_name)}</a></p>
            <p class="listing-detail-price">${parseFloat(item.price).toFixed(2)} ${item.currency}</p>
            <p class="listing-detail-desc">${escapeHtml(item.description || '')}</p>
            <p>${item.quantity > 0 ? `Dostępnych sztuk: ${item.quantity}` : 'Brak w magazynie'}</p>
            ${item.quantity > 0 ? `
              <div class="listing-detail-add-row">
                <input type="number" id="qtyInput" class="listing-detail-qty" value="1" min="1" max="${item.quantity}" />
                <button id="addToCartBtn" class="listing-detail-add-btn">Dodaj do koszyka</button>
              </div>
            ` : ''}
          </div>
        `;

        const addBtn = document.getElementById('addToCartBtn');
        if (addBtn) {
          addBtn.addEventListener('click', () => {
            const qty = Math.max(1, Math.min(item.quantity, parseInt(document.getElementById('qtyInput').value, 10) || 1));
            addToCart(item.id, qty);
            addBtn.textContent = 'Dodano ✓';
            setTimeout(() => { addBtn.textContent = 'Dodaj do koszyka'; }, 1200);
          });
        }

        loadReviews(item.id);
        setupReviewForm(item.id);
      } catch (err) {
        container.innerHTML = '<p>Błąd ładowania produktu.</p>';
      }
    }

    function renderReviews(reviews) {
      const container = document.getElementById('reviewsList');
      if (reviews.length === 0) {
        container.innerHTML = '<p class="reviews-empty">Brak opinii. Bądź pierwszy!</p>';
        return;
      }
      container.innerHTML = reviews.map((r) => `
        <div class="review-row">
          <p class="review-header"><strong>${escapeHtml(r.reviewer_username)}</strong><span class="review-stars">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</span></p>
          ${r.comment ? `<p class="review-comment">${escapeHtml(r.comment)}</p>` : ''}
          <p class="review-date">${new Date(r.created_at).toLocaleDateString('pl-PL')}</p>
        </div>
      `).join('');
    }

    async function loadReviews(listingId) {
      try {
        const res = await fetch(`${API_URL}/listings/${listingId}/reviews`);
        const reviews = await res.json();
        renderReviews(reviews);
      } catch (err) {
        console.error('Nie udało się pobrać opinii', err);
      }
    }

    async function setupReviewForm(listingId) {
      const user = getCurrentUser();
      const formWrap = document.getElementById('reviewFormWrap');
      if (!user) return;

      const reviewableStatuses = ['paid', 'processing', 'shipped', 'delivered'];
      let match = null;
      try {
        const ordersRes = await authFetch('/orders');
        if (!ordersRes.ok) return;
        const orders = await ordersRes.json();
        for (const order of orders) {
          if (!reviewableStatuses.includes(order.status)) continue;
          const item = (order.items || []).find((i) => i.listing_id === listingId && !i.reviewed);
          if (item) {
            match = item;
            break;
          }
        }
      } catch (err) {
        return;
      }
      if (!match) return;

      formWrap.style.display = 'block';
      document.getElementById('reviewForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        document.getElementById('reviewFormError').textContent = '';
        const rating = parseInt(document.getElementById('reviewRating').value, 10);
        const comment = document.getElementById('reviewComment').value.trim();
        const submitBtn = document.getElementById('reviewSubmitBtn');
        submitBtn.disabled = true;
        try {
          const res = await authFetch('/reviews', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ order_item_id: match.id, rating, comment }),
          });
          const data = await res.json();
          if (!res.ok) {
            document.getElementById('reviewFormError').textContent = data.message || 'Nie udało się dodać opinii.';
            return;
          }
          formWrap.style.display = 'none';
          loadReviews(listingId);
        } finally {
          submitBtn.disabled = false;
        }
      });
    }

    updateHeaderForAuth();
    loadListing();
  </script>
</body>
</html>
