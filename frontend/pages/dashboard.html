<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel sprzedawcy — FlipTheTable</title>
  <link rel="stylesheet" href="../css/shop.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
</head>
<body>
  <header class="shop-header">
    <a href="../index.html" class="shop-logo">Flip<span>TheTable</span></a>
    <div class="shop-header-actions" style="margin-left:auto;">
      <span id="authActions"></span>
    </div>
  </header>

  <div class="dashboard-layout">
    <h1 class="dashboard-title">Panel sprzedawcy</h1>
    <div id="dashboardBanner" class="dashboard-banner"></div>

    <div id="noShopState" class="dashboard-card" style="display:none;">
      <h2>Załóż swój sklep</h2>
      <p class="dashboard-hint">Wypełnij podstawowe informacje, aby zacząć sprzedawać na FlipTheTable.</p>
      <form id="createShopForm" class="dashboard-form">
        <div class="dashboard-field">
          <label for="shopName">Nazwa sklepu</label>
          <input type="text" id="shopName" required />
        </div>
        <div class="dashboard-field">
          <label for="shopDescription">Opis sklepu</label>
          <textarea id="shopDescription" rows="3"></textarea>
        </div>
        <div class="dashboard-field">
          <label for="shopAvatarUrl">Adres URL logo (opcjonalnie)</label>
          <input type="url" id="shopAvatarUrl" placeholder="https://..." />
        </div>
        <div class="dashboard-field">
          <label for="shopBannerUrl">Adres URL banera (opcjonalnie)</label>
          <input type="url" id="shopBannerUrl" placeholder="https://..." />
        </div>
        <button type="submit" class="dashboard-submit-btn">Załóż sklep</button>
      </form>
    </div>

    <div id="dashboardMain" style="display:none;">
      <nav class="dashboard-tabs">
        <button class="dashboard-tab active" data-tab="shop">Mój sklep</button>
        <button class="dashboard-tab" data-tab="listings">Moje oferty</button>
        <button class="dashboard-tab" data-tab="orders">Zamówienia</button>
      </nav>

      <section id="tab-shop" class="dashboard-tab-panel">
        <div class="dashboard-card">
          <h2>Statystyki sklepu</h2>
          <div class="dashboard-stats-grid" id="statsGrid"></div>
        </div>

        <div class="dashboard-card">
          <h2>Profil sklepu</h2>
          <form id="editShopForm" class="dashboard-form">
            <div class="dashboard-field">
              <label for="editShopName">Nazwa sklepu</label>
              <input type="text" id="editShopName" required />
            </div>
            <div class="dashboard-field">
              <label for="editShopDescription">Opis sklepu</label>
              <textarea id="editShopDescription" rows="3"></textarea>
            </div>
            <div class="dashboard-field">
              <label for="editShopAvatarUrl">Adres URL logo</label>
              <input type="url" id="editShopAvatarUrl" placeholder="https://..." />
            </div>
            <div class="dashboard-field">
              <label for="editShopBannerUrl">Adres URL banera</label>
              <input type="url" id="editShopBannerUrl" placeholder="https://..." />
            </div>
            <p class="dashboard-hint">Publiczny profil: <a id="shopPublicLink" href="#" target="_blank">—</a></p>
            <button type="submit" class="dashboard-submit-btn">Zapisz zmiany</button>
          </form>
        </div>
      </section>

      <section id="tab-listings" class="dashboard-tab-panel" style="display:none;">
        <div class="dashboard-card">
          <div class="dashboard-card-header">
            <h2>Moje oferty</h2>
            <button id="newListingBtn" class="dashboard-submit-btn dashboard-btn-small" type="button">+ Dodaj ofertę</button>
          </div>

          <form id="listingForm" class="dashboard-form" style="display:none;">
            <input type="hidden" id="listingId" />
            <div class="dashboard-field">
              <label for="listingTitle">Tytuł</label>
              <input type="text" id="listingTitle" required />
            </div>
            <div class="dashboard-field">
              <label for="listingDescription">Opis</label>
              <textarea id="listingDescription" rows="3"></textarea>
            </div>
            <div class="dashboard-field-row">
              <div class="dashboard-field">
                <label for="listingPrice">Cena (PLN)</label>
                <input type="number" id="listingPrice" min="0" step="0.01" required />
              </div>
              <div class="dashboard-field">
                <label for="listingQuantity">Ilość</label>
                <input type="number" id="listingQuantity" min="0" step="1" required />
              </div>
            </div>
            <div class="dashboard-field">
              <label for="listingCategory">Kategoria</label>
              <select id="listingCategory"></select>
            </div>
            <div class="dashboard-field">
              <label for="listingPhotoUrl">Adres URL zdjęcia</label>
              <input type="url" id="listingPhotoUrl" placeholder="https://..." />
            </div>
            <div class="dashboard-form-actions">
              <button type="submit" class="dashboard-submit-btn" id="listingSubmitBtn">Dodaj ofertę</button>
              <button type="button" class="dashboard-cancel-btn" id="cancelListingBtn">Anuluj</button>
            </div>
          </form>

          <div id="listingsTable" class="dashboard-list"></div>
        </div>
      </section>

      <section id="tab-orders" class="dashboard-tab-panel" style="display:none;">
        <div class="dashboard-card">
          <h2>Zamówienia</h2>
          <div id="ordersTable" class="dashboard-list"></div>
        </div>
      </section>
    </div>
  </div>

  <script src="../js/nav.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/dashboard.js"></script>
</body>
</html>
