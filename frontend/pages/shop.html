<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - FlipTheTable</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/shop.css">
</head>
<body>
    <header class="navbar">
        <div class="container">
            <h1 class="logo">FlipTheTable</h1>
            <nav class="nav-links">
                <a href="orders.html">📦 Moje zamówienia</a>
                <a href="seller-dashboard.html" id="sellerLink" style="display: none;">📊 Mój sklep</a>
                <a href="#" class="cart-link" onclick="openCart()">🛒 Koszyk (<span id="cartCount">0</span>)</a>
                <a href="#" onclick="logout()">Wyloguj</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- Filters Sidebar -->
        <aside class="sidebar">
            <h3>Filtry</h3>

            <div class="filter-group">
                <label>Kategoria:</label>
                <select id="categoryFilter" onchange="filterListings()">
                    <option value="">Wszystkie</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Szukaj:</label>
                <input type="text" id="searchInput" placeholder="Nazwa produktu..." onkeyup="filterListings()" />
            </div>

            <button class="btn-reset" onclick="resetFilters()">Resetuj filtry</button>
        </aside>

        <!-- Listings Grid -->
        <section class="products-section">
            <h2>Produkty</h2>
            <div id="listingsGrid" class="products-grid">
                <!-- Listings loaded here -->
            </div>
        </section>
    </main>

    <!-- Cart Modal -->
    <div id="cartModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeCart()">&times;</span>
            <h2>Koszyk</h2>
            <div id="cartList" class="cart-list">
                <!-- Cart items loaded here -->
            </div>
            <div class="cart-summary">
                <p>Razem: <strong id="cartTotal">0,00 zł</strong></p>
                <button class="btn-checkout" onclick="handleCheckout()">Złóż zamówienie</button>
            </div>
        </div>
    </div>

    <!-- Listing Detail Modal -->
    <div id="listingModal" class="modal">
        <div class="modal-content modal-large">
            <span class="close" onclick="closeListingDetail()">&times;</span>
            <div id="listingDetail" class="listing-detail">
                <!-- Listing details loaded here -->
            </div>
        </div>
    </div>

    <script src="../js/shop.js"></script>
</body>
</html>
